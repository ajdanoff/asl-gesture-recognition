name: ASL benchmark tests (Docker)

on:
  workflow_dispatch:
    inputs:
      benchmark:
        description: "Benchmark dataset to evaluate"
        required: true
        default: "original"
        type: choice
        options:
          - original
          - augmented
      models:
        description: "Models to evaluate"
        required: true
        default: "unified,digits,letters"
        type: string
      iou_threshold:
        description: "IoU threshold for symbol matching"
        required: false
        default: "0.45"
        type: string
      confidence:
        description: "YOLO confidence threshold"
        required: false
        default: "0.25"
        type: string

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build benchmark image
        run: docker compose build benchmark

      - name: Run benchmark
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          BENCHMARK: ${{ inputs.benchmark }}
          MODELS: ${{ inputs.models }}
          IOU_THRESHOLD: ${{ inputs.iou_threshold }}
          CONFIDENCE: ${{ inputs.confidence }}
        run: |
          docker compose run --rm \
            --user "$(id -u):$(id -g)" \
            -e GITHUB_SHA \
            benchmark \
            scripts/run_docker_benchmark.py \
            --benchmark "$BENCHMARK" \
            --models "$MODELS" \
            --iou-threshold "$IOU_THRESHOLD" \
            --confidence "$CONFIDENCE" \
            --output-dir "benchmark-reports/$BENCHMARK"

      - name: Upload benchmark reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asl-benchmark-report-${{ inputs.benchmark }}
          path: benchmark-reports/
          if-no-files-found: warn